volumes:
  static:
  media:
  pg_data:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: alexpunder/teplyj_dom_backend:latest
    restart: always
    env_file: .env
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - db

  nginx:
    image: alexpunder/teplyj_dom_nginx:latest
    restart: always
    ports:
      - 8080:80
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - backend
